<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: #f3f3f3;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6e7c7c, #4e5d5d);
        }
        .registration-form {
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            margin: 20px;
        }
        h2 {
            text-align: center;
            color: #4e5d5d;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-size: 16px;
            color: #4e5d5d;
            display: block;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
        }
        .btn-submit {
            background-color: #4e5d5d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #3a4747;
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-header h1 {
            font-size: 28px;
            color: #4e5d5d;
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
        }
        .form-footer a {
            text-decoration: none;
            color: #4e5d5d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="registration-form">
            <div class="form-header">
                <h1>College Admission Registration</h1>
            </div>

            <form id="admission-form">
                <!-- Personal Details Section -->
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Contact Details Section -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                </div>

                <!-- Course Details Section -->
                <div class="form-group">
                    <label for="course">Course Selection</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="BSc Computer Science">BSc Computer Science</option>
                        <option value="BSc Engineering">BSc Engineering</option>
                        <option value="BA English">BA English</option>
                        <option value="BBA Business Administration">BBA Business Administration</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="additional-info">Additional Information</label>
                    <textarea id="additional-info" name="additional-info" rows="4" placeholder="Any additional information or queries"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Submit Application</button>
            </form>

            <div class="form-footer">
                <p>Already have an account? <a href="#">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        // Basic form validation (optional)
        document.getElementById("admission-form").addEventListener("submit", function(e) {
            e.preventDefault();
            alert("Your application has been submitted successfully!");
        });
    </script>
</body>
</html>
